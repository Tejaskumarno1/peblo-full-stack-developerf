# Render Blueprint: describes how Peblo runs on Render (https://render.com/docs/blueprint-spec).
# Secrets are never stored here: Render asks for them in the dashboard (sync: false).
services:
  - type: web
    name: peblo
    runtime: node
    region: singapore
    plan: free
    branch: supabase
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SERVER_AI_KEYS
        value: "off"
      - key: PEBLO_HOSTED
        value: "1"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: PEBLO_DB_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Encryption at rest for note text: a base64 32-byte key (node -e "console.log(require('crypto').randomBytes(32).toString('base64'))").
      # Keep a copy outside Render: without it the encrypted notes cannot be read. See docs/DEPLOYMENT.md.
      - key: PEBLO_DATA_KEY
        sync: false
