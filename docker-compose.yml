# A local Postgres for development and for the end-to-end tests.
#   docker compose up -d
# Then set DATABASE_URL=postgresql://postgres:peblo@127.0.0.1:55432/peblo_dev in server/.env
# and PEBLO_TEST_DATABASE_URL=postgresql://postgres:peblo@127.0.0.1:55432/peblo_test for the tests.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: peblo
      POSTGRES_DB: peblo_dev
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata: