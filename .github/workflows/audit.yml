name: Dependency audit

on:
  push:
    branches: [app, main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Shipped dependencies must have no NEW high or critical advisories. Reviewed ones live in
      # .github/audit-allowlist.json (reason, link, expiry); see docs/SECURITY-AUDIT.md.
      # npm audit needs the lockfiles only, so nothing is installed.
      - name: Audit gate (root and client)
        run: node scripts/audit-gate.mjs
