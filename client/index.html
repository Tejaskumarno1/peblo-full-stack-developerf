<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Peblo Notes — AI-powered notes, to-dos and calendar" />
    <title>Peblo</title>
    <script>
      // Apply the saved theme before anything is drawn, so a dark theme never starts with a white flash (PEB-102).
      // AuthContext does the same afterwards and keeps it in step; this only covers the first frame.
      (function () {
        try {
          var t = localStorage.getItem('peblo-theme') || 'light';
          var s = localStorage.getItem('peblo-style') || 'studio';
          var dark = t === 'dark' || t === 'midnight' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-style', s);
          if (dark) { r.classList.add('theme-dark'); if (t === 'midnight') r.classList.add('theme-midnight'); }
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage blocked: the app sets the theme once it starts */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
