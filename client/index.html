<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Peblo Notes — AI-powered notes, to-dos and calendar" />
    <title>Peblo</title>
    <script>
      // Apply the saved theme before anything is drawn, so a dark theme never starts with a white flash (PEB-102).
      // AuthContext does the same afterwards and keeps it in step; this only covers the first frame.
      (function () {
        try {
          var t = localStorage.getItem('peblo-theme') || 'light';
          var s = localStorage.getItem('peblo-style') || 'studio';
          var dark = t === 'dark' || t === 'midnight' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.setAttribute('data-style', s);
          if (dark) { r.classList.add('theme-dark'); if (t === 'midnight') r.classList.add('theme-midnight'); }
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage blocked: the app sets the theme once it starts */ }
      })();
    </script>
  </head>
  <body>
    <!-- Shown until the app draws itself, so the page is never blank. If the app has not started after 12 s
         (a file failed to load, a very slow connection), it says so and offers a reload. -->
    <div id="root"><div id="pb-boot" style="min-height:100vh;display:grid;place-items:center;font:15px system-ui,sans-serif;color:#6e6559;text-align:center;padding:24px;box-sizing:border-box"><div><div id="pb-boot-msg">Loading Peblo…</div><button id="pb-boot-btn" type="button" style="display:none;margin-top:14px;padding:10px 22px;border:0;border-radius:999px;background:#C4441C;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer" onclick="location.reload()">Reload</button></div></div></div>
    <script>
      setTimeout(function () {
        var m = document.getElementById('pb-boot-msg'), b = document.getElementById('pb-boot-btn');
        if (m && b) { m.textContent = 'Peblo is taking longer than usual to start.'; b.style.display = 'inline-block'; }
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
