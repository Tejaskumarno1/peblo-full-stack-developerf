<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Peblo Notes — AI-powered notes, to-dos and calendar" />
    <title>Peblo</title>
    <script>
      // Apply the saved theme before anything is drawn, so a dark theme never starts with a white flash (PEB-102).
      // AuthContext does the same afterwards and keeps it in step; this only covers the first frame.
      (function () {
        try {
          var t = localStorage.getItem('peblo-theme') || 'system';
          var s = localStorage.getItem('peblo-style') || 'soft';
          var mid = t === 'midnight';
          var dark = t === 'dark' || mid || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          if (t === 'auto') { // "Auto by time": dark between two times (settings.themeSchedule, copied to 'peblo-schedule')
            var sc = {}; try { sc = JSON.parse(localStorage.getItem('peblo-schedule') || '{}') || {}; } catch (e2) { /* default */ }
            var tm = function (v, d) { var m = /^(\d\d):(\d\d)$/.exec(v || ''); return m ? (+m[1]) * 60 + (+m[2]) : d; };
            var a = tm(sc.from, 1200), b = tm(sc.to, 420), d0 = new Date(), n = d0.getHours() * 60 + d0.getMinutes();
            dark = a !== b && (a < b ? n >= a && n < b : n >= a || n < b);
            mid = dark && sc.dark === 'midnight';
          }
          var r = document.documentElement;
          r.setAttribute('data-style', s);
          if (dark) { r.classList.add('theme-dark'); if (mid) r.classList.add('theme-midnight'); }
          // accent colour: the CSS was generated by utils/appearance.js when the colour was chosen (key 'peblo-accent')
          var ac = localStorage.getItem('peblo-accent'), acss = localStorage.getItem('peblo-accent-css');
          if (ac && acss && /^#[0-9A-Fa-f]{6}$/.test(ac) && !/[<>@]|url\(|expression|import/i.test(acss)) { // the CSS is only ever made by appearance.js; anything else is ignored
             var st = document.createElement('style'); st.id = 'pb-accent'; st.textContent = acss; document.head.appendChild(st); }
          r.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* storage blocked: the app sets the theme once it starts */ }
      })();
    </script>
  </head>
  <body>
    <!-- Shown until the app draws itself, so the page is never blank. If the app has not started after 12 s
         (a file failed to load, a very slow connection), it says so and offers a reload. -->
    <div id="root"><div id="pb-boot" style="min-height:100vh;display:grid;place-items:center;font:15px system-ui,sans-serif;color:#6e6559;text-align:center;padding:24px;box-sizing:border-box"><div><div id="pb-boot-msg">Loading Peblo…</div><button id="pb-boot-btn" type="button" style="display:none;margin-top:14px;padding:10px 22px;border:0;border-radius:999px;background:#C4441C;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer">Reload</button></div></div></div>
    <script>
      setTimeout(function () {
        var m = document.getElementById('pb-boot-msg'), b = document.getElementById('pb-boot-btn');
        if (b) b.addEventListener('click', function () { location.reload(); });
        if (m && b) { m.textContent = 'Peblo is taking longer than usual to start.'; b.style.display = 'inline-block'; }
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
