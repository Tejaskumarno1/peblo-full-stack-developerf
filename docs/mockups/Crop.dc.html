<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture crop dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>body{margin:0;font-family:Figtree,system-ui,sans-serif}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width:640px;height:680px;box-sizing:border-box;background:#b9afa5;padding:28px;display:flex;align-items:center;justify-content:center">
  <div style="width:584px;background:#fffdf8;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px;color:#2a1f17;box-shadow:0 24px 60px rgba(42,31,23,0.3)">
    <div style="display:flex;align-items:center">
      <div style="flex-grow:1;font-size:22px;font-weight:800">Crop your picture</div>
      <button aria-label="Close" style="width:40px;height:40px;border-radius:20px;border:0;background:#f4ede2;color:#2a1f17;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:18px;align-items:start">
      <div style="position:relative;height:340px;border-radius:20px;overflow:hidden;background:#2a1f17">
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#7ea7b8,#d9b38c 55%,#8a5a44)"></div>
        <div style="position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:150px;box-shadow:0 0 0 400px rgba(26,18,12,0.62);border:3px solid #fff"></div>
        <div style="position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)">
          <div style="border-right:1px solid rgba(255,255,255,0.35);border-bottom:1px solid rgba(255,255,255,0.35)"></div><div style="border-right:1px solid rgba(255,255,255,0.35);border-bottom:1px solid rgba(255,255,255,0.35)"></div><div style="border-bottom:1px solid rgba(255,255,255,0.35)"></div>
          <div style="border-right:1px solid rgba(255,255,255,0.35);border-bottom:1px solid rgba(255,255,255,0.35)"></div><div style="border-right:1px solid rgba(255,255,255,0.35);border-bottom:1px solid rgba(255,255,255,0.35)"></div><div style="border-bottom:1px solid rgba(255,255,255,0.35)"></div>
          <div style="border-right:1px solid rgba(255,255,255,0.35)"></div><div style="border-right:1px solid rgba(255,255,255,0.35)"></div><div></div>
        </div>
        <div style="position:absolute;left:12px;bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(26,18,12,0.7);color:#fff;font-size:12px;font-weight:600">Drag to move</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="font-size:12px;font-weight:700;color:#6b5d50;letter-spacing:0.06em;text-transform:uppercase">Preview</div>
        <div style="width:112px;height:112px;border-radius:56px;background:linear-gradient(135deg,#7ea7b8,#d9b38c 55%,#8a5a44);box-shadow:0 0 0 4px #fff,0 0 0 6px #eadfce"></div>
        <div style="width:40px;height:40px;border-radius:20px;background:linear-gradient(135deg,#7ea7b8,#d9b38c 55%,#8a5a44)"></div>
        <div style="width:28px;height:28px;border-radius:14px;background:linear-gradient(135deg,#7ea7b8,#d9b38c 55%,#8a5a44)"></div>
        <div style="font-size:12px;color:#6b5d50;text-align:center;line-height:1.4">Square 1:1, saved at 512 by 512</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b5d50" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4M8.5 11h5"/></svg>
      <div style="position:relative;flex-grow:1;height:6px;border-radius:3px;background:#eadfce"><div style="position:absolute;left:0;top:0;height:6px;width:38%;border-radius:3px;background:#c4441c"></div><div style="position:absolute;left:38%;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:10px;background:#fff;border:3px solid #c4441c"></div></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b5d50" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4M8.5 11h5M11 8.5v5"/></svg>
      <span style="width:1px;height:26px;background:#eadfce"></span>
      <button aria-label="Rotate left" style="width:40px;height:40px;border-radius:20px;border:1.5px solid #eadfce;background:#fff;color:#2a1f17;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4M4 9h5M5 13a8 8 0 108-8 8 8 0 00-6 3"/></svg></button>
      <button aria-label="Flip" style="width:40px;height:40px;border-radius:20px;border:1.5px solid #eadfce;background:#fff;color:#2a1f17;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M8 7L3 12l5 5zM16 7l5 5-5 5z"/></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button style="padding:10px 16px;border-radius:999px;border:1.5px solid #eadfce;background:#fff;font-weight:700;font-size:14px;color:#2a1f17">Choose another</button>
      <button style="padding:10px 16px;border-radius:999px;border:0;background:transparent;font-weight:700;font-size:14px;color:#6b5d50">Reset</button>
      <span style="flex-grow:1"></span>
      <button style="padding:11px 20px;border-radius:999px;border:0;background:#f4ede2;font-weight:700;font-size:14px;color:#2a1f17">Cancel</button>
      <button style="padding:11px 22px;border-radius:999px;border:0;background:#c4441c;color:#fff;font-weight:700;font-size:14px">Save picture</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":680}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
